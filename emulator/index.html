<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Web Emulator</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="game"></div>

  <script type="text/javascript">
    // 1. Obtener parámetros de la URL (?game=pokemon.gba&core=gba)
    const urlParams = new URLSearchParams(window.location.search);
    const gameFile = urlParams.get('game');
    const systemCore = urlParams.get('core') || 'gb';

    if (gameFile) {
      // 2. Configuración dinámica de EmulatorJS
      EJS_player = '#game';
      EJS_gameUrl = `./roms/${encodeURIComponent(gameFile)}`;
      EJS_core = systemCore;             // Consola (gba, nes, snes, megadrive, etc.)
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Archivos del emulador desde CDN

      // 3. Cargar el script ejecutable de EmulatorJS
      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    } else {
      document.body.innerHTML = '<h1 style="color:white; text-align:center; margin-top:20%;">Inserta o escanea una tarjeta NFC válida.</h1>';
    }
  </script>
</body>
</html>
